services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: news_app
      MARIADB_USER: news_user
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run python scripts/configure.py --docker first}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Generate a local root password in .env}
    volumes:
      - news_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  web:
    build: .
    env_file: .env
    environment:
      NEWS_DB_ENGINE: mariadb
      DB_HOST: db
      DB_NAME: news_app
      DB_USER: news_user
      API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
volumes:
  news_db:
